<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Plot Twist</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="card">
  <header class="top">
    <img class="logo" src="../icons/logo.svg" alt="" width="32" height="32">
    <div class="title">
      <h1>Plot Twist</h1>
      <p id="master-note">Effects for your Meet camera</p>
    </div>
    <input type="checkbox" id="enabled" role="switch" aria-label="Effects on or off" title="Effects on/off">
  </header>

  <p class="status" id="status" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text"></span></p>

  <section class="actions" id="actions" aria-label="Effects"></section>

  <section class="bg-photo" aria-label="Empty background photo">
    <button type="button" id="capture" class="row-btn">
      <svg class="row-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-2h6l2 2h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span class="row-text">
        <span id="capture-label">Capture empty background</span>
        <small id="capture-hint">Step out of frame for 5 s</small>
      </span>
    </button>
    <div class="thumb" id="thumb-wrap" hidden>
      <img id="thumb" alt="Empty background photo">
      <button type="button" id="clear" class="clear" title="Delete background photo" aria-label="Delete background photo">✕</button>
    </div>
  </section>

  <section class="settings" aria-label="Auto-detect">
    <h2>Gestures</h2>
    <div id="toggles"></div>
  </section>
</main>
<script src="../src/actions.js"></script>
<script src="popup.js"></script>
</body>
</html>
