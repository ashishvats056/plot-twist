<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Plot Twist</title>
  <defs>
    <linearGradient id="pt-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC233"/>
      <stop offset="1" stop-color="#FF4F5E"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#pt-bg)"/>
  <!-- video camera: body + lens wedge -->
  <rect x="14" y="30" width="72" height="68" rx="16" fill="#1B1424"/>
  <path d="M90 56 L116 38 V90 L90 72 Z" fill="#1B1424" stroke="#1B1424" stroke-width="6" stroke-linejoin="round"/>
  <!-- "?!" plot-twist mark on the camera -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 51 C31 44 36 40 42 40 C49 40 53 44 53 50 C53 56 47 58 44 61 C42.5 62.5 42 64 42 67"/>
    <path d="M68 41 L66 67"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="42" cy="82" r="5.5"/>
    <circle cx="65.2" cy="82" r="5.5"/>
  </g>
</svg>
